<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" width="760" height="476" role="img" aria-labelledby="pending-title pending-desc">
  <title id="pending-title">Why an erasure can be pending</title>
  <desc id="pending-desc">Three stages of the write-ahead log. Before a Forget, some frames in the log hold a capture's sealed text and wrapped key. When the Forget commits while a reader in another process holds the log, the keys are deleted and the cells zeroed in new frames, but the old frames stay in the log because the reader blocks truncation; the receipt's completed_at stays empty. When the reader lets go, the next writer truncates the log and stamps completed_at.</desc>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; font-size: 13px; }
    .h { font-weight: 600; font-size: 14px; }
    .big { font-weight: 600; font-size: 17px; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #1f2937; }
    .s { fill: #64748b; }
    .card { fill: none; stroke: #64748b; stroke-width: 1.5; }
    .other { fill: #64748b; fill-opacity: 0.3; stroke: #64748b; stroke-width: 1.2; }
    .gone { fill: #c2410c; fill-opacity: 0.35; stroke: #c2410c; stroke-width: 1.5; }
    .zero { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 3 2; }
    .reader { fill: none; stroke: #1d4ed8; stroke-width: 2; }
    .rtext { fill: #1d4ed8; font-weight: 600; }
    .done { fill: #1d4ed8; fill-opacity: 0.1; stroke: #1d4ed8; stroke-width: 1.5; }
    .wait { fill: #c2410c; fill-opacity: 0.12; stroke: #c2410c; stroke-width: 1.5; }
    .none { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 1.5; }
  </style>

  <rect x="0.75" y="0.75" width="758.5" height="474.5" rx="12" fill="#f8fafc" stroke="#64748b" stroke-opacity="0.4"/>
  <text class="t big" x="24" y="36">Why an erasure can be pending</text>

  <!-- panel 1 -->
  <rect class="card" x="16" y="56" width="232" height="324" rx="10"/>
  <text class="t h" x="36" y="84">1. Before</text>
  <text class="t s" x="36" y="102">no revocation yet</text>
  <text class="m" x="36" y="134">store.sqlite-wal</text>
  <rect class="other" x="36" y="144" width="24" height="24" rx="3"/>
  <rect class="gone" x="66" y="144" width="24" height="24" rx="3"/>
  <rect class="other" x="96" y="144" width="24" height="24" rx="3"/>
  <rect class="other" x="126" y="144" width="24" height="24" rx="3"/>
  <text class="t" x="36" y="236">New writes reach the log first.</text>
  <text class="t" x="36" y="256">Some frames hold a capture's</text>
  <text class="t" x="36" y="274">sealed text and wrapped key.</text>
  <text class="t" x="36" y="294">Reads under a grant: allowed.</text>
  <rect class="done" x="32" y="340" width="200" height="30" rx="6"/>
  <text class="m" x="44" y="360">no erasure receipt yet</text>

  <!-- panel 2 -->
  <rect class="card" x="264" y="56" width="232" height="324" rx="10"/>
  <text class="t h" x="284" y="84">2. Forget commits</text>
  <text class="t s" x="284" y="102">a reader holds the log</text>
  <text class="m" x="284" y="134">store.sqlite-wal</text>
  <rect class="other" x="284" y="144" width="24" height="24" rx="3"/>
  <rect class="gone" x="314" y="144" width="24" height="24" rx="3"/>
  <rect class="other" x="344" y="144" width="24" height="24" rx="3"/>
  <rect class="other" x="374" y="144" width="24" height="24" rx="3"/>
  <rect class="zero" x="404" y="144" width="24" height="24" rx="3"/>
  <rect class="zero" x="434" y="144" width="24" height="24" rx="3"/>
  <path class="reader" d="M284 182 L284 190 L458 190 L458 182"/>
  <text class="t rtext" x="284" y="210">reader in another process</text>
  <text class="t" x="284" y="236">Keys are deleted and cells</text>
  <text class="t" x="284" y="254">zeroed, in new frames. The old</text>
  <text class="t" x="284" y="272">frames stay: the reader blocks</text>
  <text class="t" x="284" y="290">truncation. They hold sealed</text>
  <text class="t" x="284" y="308">bytes and a wrapped key.</text>
  <text class="t" x="284" y="328">Reads: already refused.</text>
  <rect class="wait" x="280" y="340" width="200" height="30" rx="6"/>
  <text class="m" x="292" y="360">completed_at: empty</text>

  <!-- panel 3 -->
  <rect class="card" x="512" y="56" width="232" height="324" rx="10"/>
  <text class="t h" x="532" y="84">3. The reader lets go</text>
  <text class="t s" x="532" y="102">nothing holds the log</text>
  <text class="m" x="532" y="134">store.sqlite-wal</text>
  <rect class="none" x="532" y="144" width="192" height="24" rx="3"/>
  <text class="t s" x="628" y="161" text-anchor="middle">truncated</text>
  <text class="t" x="532" y="236">The next writer to open the</text>
  <text class="t" x="532" y="254">store, the app's next tick or</text>
  <text class="t" x="532" y="272">the next pcap command</text>
  <text class="t" x="532" y="290">truncates the log.</text>
  <text class="t" x="532" y="310">It stamps the receipt.</text>
  <rect class="done" x="528" y="340" width="200" height="30" rx="6"/>
  <text class="m" x="540" y="360">completed_at: set</text>

  <!-- arrows between panels -->
  <path class="arrow" d="M250 206 L262 206 M258 202 L262 206 L258 210"/>
  <path class="arrow" d="M498 206 L510 206 M506 202 L510 206 L506 210"/>

  <!-- legend -->
  <rect class="gone" x="24" y="402" width="16" height="16" rx="3"/>
  <text class="t" x="48" y="415">a frame holding a revoked capture's sealed text or wrapped key</text>
  <rect class="other" x="24" y="426" width="16" height="16" rx="3"/>
  <text class="t" x="48" y="439">other data</text>
  <rect class="zero" x="170" y="426" width="16" height="16" rx="3"/>
  <text class="t" x="194" y="439">a new frame, deleted cells zeroed</text>
  <path class="reader" d="M474 430 L474 438 L496 438 L496 430"/>
  <text class="t" x="504" y="439">a reader's snapshot</text>
</svg>
