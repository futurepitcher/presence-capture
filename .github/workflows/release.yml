name: Release

# A signed, notarized DMG of Presence Capture, built from a v* tag (R3). A pushed tag makes a
# draft GitHub Release, which the maintainer publishes as a separate step. A dispatched run is a
# dry run: it builds, signs, notarizes and attests, and publishes nothing. It's dispatched on a
# v0.0.* tag, and only those: verifying a release (docs/verify.md) can't tell a dispatched run's
# attestation from a pushed one's, so the tag must. Pushing a v0.0.* tag builds nothing.
on:
  push:
    tags: ['v*', '!v0.0.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize
    # GitHub-hosted, a throwaway VM: never self-hosted. A public repository's workflows must not
    # run on the maintainer's Mac.
    runs-on: macos-26
    # Only this environment holds the six Apple secrets. It asks the maintainer to approve each
    # run, and deploys only from v* tags: no pull request or fork can reach them.
    environment: release
    timeout-minutes: 90
    permissions:
      contents: write      # the draft release
      id-token: write      # the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All of history: the build number (CFBundleVersion) is the count of commits.
          fetch-depth: 0

      - name: From a v* tag
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "A release, or its dry run, runs on a v* tag (dispatch the dry run on one)." >&2
            exit 1
          fi
          dry=false
          [[ "${GITHUB_REF}" == refs/tags/v0.0.* ]] && dry=true
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch && "${dry}" == false ]] || [[ "${GITHUB_EVENT_NAME}" == push && "${dry}" == true ]]; then
            echo "A dry run is dispatched on a v0.0.* tag (as v0.0.0); a release is a pushed tag of any other version." >&2
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "${GITHUB_ENV}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: What it's built with
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"

      - name: Build, sign, notarize and staple
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packages/daemon/release.sh "${VERSION}" dist

      - name: Provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Presence-Capture-${{ env.VERSION }}.dmg

      # The same bundle attached to the release, under a name OpenSSF Scorecard's Signed-Releases
      # check recognizes.
      - name: Attach the provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "${BUNDLE}" "dist/Presence-Capture-${VERSION}.dmg.intoto.jsonl"

      - name: Draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag \
            --title "Presence Capture ${VERSION}" --notes-file dist/notes.md \
            "dist/Presence-Capture-${VERSION}.dmg" dist/SHA256SUMS "dist/Presence-Capture-${VERSION}.cdx.json" \
            dist/build-info.json "dist/Presence-Capture-${VERSION}.dmg.intoto.jsonl"

      - name: Dry run's files
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dry-run-${{ env.VERSION }}
          path: dist/
          retention-days: 7
