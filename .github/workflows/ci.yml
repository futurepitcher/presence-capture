name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Required files are present
        run: |
          set -euo pipefail
          for f in LICENSE NOTICE README.md ROADMAP.md CONTRIBUTING.md \
                   SECURITY.md CODE_OF_CONDUCT.md \
                   docs/spec/SCHEMA.md docs/spec/DRIVER.md \
                   docs/adr/0001-serving-trust-boundary.md \
                   docs/adr/0002-erasable-revocation.md \
                   GOVERNANCE.md rfcs/README.md; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done

      - name: License is Apache-2.0
        run: grep -q "Apache License" LICENSE && grep -q "Version 2.0" LICENSE

      - name: Markdown links resolve
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --offline --include-fragments .
          fail: true

  conformance:
    name: Conformance suites (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}

      # Links the workspaces, exactly as the lockfile says. There are no
      # third-party dependencies to fetch: both suites run on node:sqlite and
      # node:test.
      - name: Link workspaces
        run: npm ci --no-audit --no-fund

      # The reference API layer, then the store layer through the reference
      # driver process: the path another implementation's driver takes.
      - name: Schema conformance (R1-R12, API and store layers)
        working-directory: packages/schema
        run: npm test

      - name: MCP conformance (ADR 0001 T1-T12)
        working-directory: packages/mcp
        run: npm test

  # The macOS daemon: its own tests, then the store-layer suite driven through
  # its pcap-driver, so the Swift store is held to the same bytes as the
  # reference. Transcriber tests skip on a runner without the speech model.
  daemon:
    name: macOS daemon
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Swift tests
        working-directory: packages/daemon
        run: swift test

      - name: Store-layer conformance against the Swift driver
        working-directory: packages/schema
        run: |
          swift build --package-path ../daemon --product pcap-driver
          PRESENCE_CAPTURE_DRIVER="$(swift build --package-path ../daemon --show-bin-path)/pcap-driver" npm run conformance:store

  # Developer Certificate of Origin (GOVERNANCE.md): every commit in a pull
  # request carries a Signed-off-by trailer naming its author. Sign off with
  # `git commit -s`.
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$commit")"
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$commit" | grep -qF "$author"; then
              echo "::error::$(git log -1 --format='%h %s' "$commit") is not signed off by $author"
              missing=1
            fi
          done
          exit "$missing"
