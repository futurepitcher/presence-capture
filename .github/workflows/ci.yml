name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Required files are present
        run: |
          set -euo pipefail
          for f in LICENSE NOTICE README.md ROADMAP.md CONTRIBUTING.md \
                   SECURITY.md CODE_OF_CONDUCT.md \
                   docs/spec/SCHEMA.md docs/adr/0001-serving-trust-boundary.md; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done

      - name: License is Apache-2.0
        run: grep -q "Apache License" LICENSE && grep -q "Version 2.0" LICENSE

      - name: Markdown links resolve
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline --include-fragments .
          fail: true

  conformance:
    name: Conformance suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Links the workspaces. There are no third-party dependencies to fetch:
      # both suites run on node:sqlite and node:test.
      - name: Link workspaces
        run: npm install --no-audit --no-fund

      - name: Schema conformance (R1-R10)
        working-directory: packages/schema
        run: npm test

      - name: MCP conformance (ADR 0001 T1-T12)
        working-directory: packages/mcp
        run: npm test
