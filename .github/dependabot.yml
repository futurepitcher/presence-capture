# Updates arrive as pull requests, so each one is reviewed and runs the
# conformance suites before it lands. The npm packages have no third-party
# dependencies today; this watches for any that appear.
version: 2
updates:
  # A release is at least 14 days old before it's proposed: time for a bad
  # or compromised release to be found and pulled first.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
